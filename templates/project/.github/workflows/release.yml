name: Release
on:
  push:
    tags: ['specification-v*', 'extension-v*', 'website-v*']
permissions:
  contents: write
  id-token: write
  packages: write
jobs:
  release:
    uses: it-perspectives/open-tooling/.github/workflows/release.yml@TOOLING_COMMIT_SHA
    with:
      tooling-ref: TOOLING_COMMIT_SHA
      require-complete: true
