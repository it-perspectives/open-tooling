name: Verify open project
on:
  workflow_call:
    inputs:
      tooling-ref:
        description: Full commit SHA of open-tooling; pin to the same SHA as this workflow
        required: true
        type: string
      manifest:
        default: .open-project.json
        type: string
      require-complete:
        description: Require schema, npm, VSIX and website products
        default: true
        type: boolean
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - name: Validate tooling pin
        env:
          TOOLING_REF: ${{ inputs.tooling-ref }}
        run: '[[ "$TOOLING_REF" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          repository: it-perspectives/open-tooling
          ref: ${{ inputs.tooling-ref }}
          path: .open-tooling-runtime
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --prefix .open-tooling-runtime
      - run: npm ci --ignore-scripts
      - name: Check, build, package and test installed products
        env:
          MANIFEST: ${{ inputs.manifest }}
          COMPLETE: ${{ inputs.require-complete }}
          OPEN_TOOLING_COMMIT: ${{ inputs.tooling-ref }}
        shell: bash
        run: |
          flags=()
          if [[ "$COMPLETE" == true ]]; then flags+=(--complete); fi
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then flags+=(--tag "$GITHUB_REF_NAME"); fi
          xvfb-run -a node .open-tooling-runtime/bin/open-tooling.js build --manifest "$MANIFEST" "${flags[@]}"
      - uses: actions/upload-artifact@v4
        if: matrix.node == 24
        with:
          name: open-products
          path: dist/open-tooling/
          if-no-files-found: error
          overwrite: true
          retention-days: 14
          compression-level: 0
